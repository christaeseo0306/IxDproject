<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>FaceTime</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2334c759'/><path d='M22 36h38a6 6 0 016 6v16a6 6 0 01-6 6H22a6 6 0 01-6-6V42a6 6 0 016-6zm50 10l14-10v28L72 54z' fill='%23fff'/></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body data-state="gate" data-part="call">

<!-- 바탕화면 -->
<div id="desktop" class="desktop"></div>

<!-- ───────────────────────── GATE ───────────────────────── -->
<section id="gate" class="overlay is-on">
  <div class="gate-inner">
    <div class="gate-icon" aria-hidden="true">
      <svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#34c759"/><path d="M22 36h38a6 6 0 016 6v16a6 6 0 01-6 6H22a6 6 0 01-6-6V42a6 6 0 016-6zm50 10l14-10v28L72 54z" fill="#fff"/></svg>
    </div>
    <h1 class="gate-title">FaceTime</h1>
    <p class="gate-sub">클릭하면 <span id="gate-name">—</span> 님에게 영상통화를 겁니다</p>
    <button id="gate-btn" class="gate-btn" type="button">통화 걸기</button>
    <p id="gate-note" class="gate-note"></p>
  </div>
</section>

<!-- ───────────────────────── FACETIME 창 ───────────────────────── -->
<main id="window" class="window" aria-label="FaceTime">

  <div class="stage">
    <!-- 파트 1·2 : 준비한 영상 (A/B 더블 버퍼) -->
    <video id="vA" class="clip is-active" playsinline preload="auto" disablepictureinpicture></video>
    <video id="vB" class="clip" playsinline preload="auto" disablepictureinpicture></video>

    <!-- 발신 중 : 내 카메라가 창 전체를 채운다 -->
    <video id="self-main" class="self-main self-feed" autoplay muted playsinline></video>
    <div class="self-main-off">
      <svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 014.5 6h7.3L21 15.2V8.8L17 12M2 2l20 20" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      <span>카메라 꺼짐</span>
    </div>

    <div id="placeholder" class="placeholder" hidden>
      <div class="ph-index">01</div>
      <div class="ph-label">클립 제목</div>
      <div class="ph-note">videos/ 폴더에 영상 파일이 없습니다</div>
    </div>

    <div id="glitch" class="glitch" hidden>
      <div class="noise"></div>
      <p class="glitch-text">ACQUIRING SIGNAL…</p>
    </div>
  </div>

  <!-- ── CCTV 스킨 (파트 2) ── -->
  <div class="skin skin-cctv" aria-hidden="true">
    <div class="cctv-grain"></div>
    <div class="cctv-scan"></div>
    <div class="cctv-vig"></div>
    <div class="cctv-corner tl"></div><div class="cctv-corner tr"></div>
    <div class="cctv-corner bl"></div><div class="cctv-corner br"></div>
    <div class="cctv-top">
      <div class="rec"><span class="rec-dot"></span>REC</div>
      <div id="cctv-cam" class="cctv-cam mono">CAM 03</div>
    </div>
    <div class="cctv-topright mono">
      <div id="cctv-date">2026-10-08</div>
      <div id="cctv-time" class="cctv-time">21:14:03</div>
    </div>
    <div class="cctv-bottom mono">
      <span id="cctv-loc">LIVING ROOM</span>
      <span class="cctv-meta" id="cctv-meta">1080P · 30FPS · CH 03/08</span>
    </div>
    <div id="cctv-self" class="cctv-self">
      <video id="self-cctv" class="self-feed" autoplay muted playsinline></video>
      <span class="mono">CAM 01 · LOCAL</span>
    </div>
  </div>

  <!-- ── macOS 창 크롬 : 트래픽 라이트 + 이름 pill ── -->
  <div class="chrome">
    <div class="traffic"><i class="t-red"></i><i class="t-yellow"></i><i class="t-green"></i></div>
    <div class="name-pill">
      <span id="pill-avatar" class="pill-avatar">—</span>
      <span id="pill-name">—</span>
      <span class="chev" aria-hidden="true">›</span>
    </div>
    <span id="pill-timer" class="pill-timer mono">00:00</span>
  </div>
  <button id="btn-shutter" class="shutter" type="button" aria-label="효과"></button>

  <!-- ── 셀프뷰 PiP (연결 후) ── -->
  <div id="selfview" class="selfview">
    <video id="self-pip" class="self-feed" autoplay muted playsinline></video>
    <div class="self-off">
      <svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 014.5 6h7.3L21 15.2V8.8L17 12M2 2l20 20" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <span>카메라 꺼짐</span>
    </div>
    <span class="mini mini-l" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M5 19V5h9M5 12h7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
    </span>
    <span class="mini mini-r" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.6-5.9M20 3v4.5h-4.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </div>

  <!-- ── 컨트롤 (우하단) ── -->
  <div id="controls" class="controls">
    <button class="cb cb-video" id="btn-cam" type="button" aria-label="카메라">
      <svg class="i-on" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 014.5 6h9A1.5 1.5 0 0115 7.5v9A1.5 1.5 0 0113.5 18h-9A1.5 1.5 0 013 16.5v-9zM17 12l4-3.2v6.4L17 12z" fill="currentColor"/></svg>
      <svg class="i-off" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 014.5 6h7.3L21 15.2V8.8L17 12M2 2l20 20" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
    </button>
    <button class="cb cb-mic" id="btn-mute" type="button" aria-label="마이크">
      <svg class="i-on" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0012 0M12 17.5V21" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
      <svg class="i-off" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0012 0M12 17.5V21M3.5 3.5l17 17" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
    </button>
    <button class="cb cb-more" id="btn-more" type="button" aria-label="더 보기">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18" cy="12" r="1.7" fill="currentColor"/></svg>
    </button>
    <button class="cb cb-end" id="btn-end" type="button" aria-label="통화 종료">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2.3" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- 발신 중 상태 표시 -->
  <div id="status" class="status">
    <span id="status-text">연결 중…</span>
    <span id="status-hint" class="status-hint"><span class="kbd">→</span> 통화 시작</span>
  </div>

  <!-- 통화 종료 오버레이 -->
  <div id="ended" class="ended">
    <p class="ended-label">통화 종료</p>
    <h2 id="ended-name" class="ended-name">—</h2>
    <p id="ended-dur" class="mono ended-dur">00:00</p>
    <button id="restart-btn" class="gate-btn" type="button">다시 걸기</button>
  </div>

  <div id="toast" class="toast" hidden></div>
</main>

<!-- ───────────────────────── 발표자 패널 ───────────────────────── -->
<aside id="presenter" class="presenter" hidden>
  <header>
    <strong>발표자 패널</strong>
    <button id="presenter-close" type="button" aria-label="닫기">✕</button>
  </header>
  <ol id="presenter-list"></ol>
  <footer>
    <div class="keys">
      <span><span class="kbd">→</span> 다음</span><span><span class="kbd">←</span> 이전</span>
      <span><span class="kbd">R</span> 다시</span><span><span class="kbd">F</span> 전체화면</span>
      <span><span class="kbd">M</span> 마이크</span><span><span class="kbd">C</span> 카메라</span>
      <span><span class="kbd">H</span> 패널</span><span><span class="kbd">Esc</span> 종료</span>
      <span><span class="kbd">1</span>–<span class="kbd">9</span> 바로가기</span>
    </div>
  </footer>
</aside>

<div id="warn" class="warn" hidden></div>

<script src="app.js"></script>
</body>
</html>
